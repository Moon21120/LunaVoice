<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Voice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(135, 105, 255, 0.25),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(70, 100, 255, 0.12),
                    transparent 35%
                ),
                #07070b;
        }

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: float 10s ease-in-out infinite;
        }

        .orb.one {
            width: 350px;
            height: 350px;
            background: rgba(130, 100, 255, 0.2);
            top: -150px;
            left: -100px;
        }

        .orb.two {
            width: 300px;
            height: 300px;
            background: rgba(80, 100, 255, 0.16);
            right: -120px;
            bottom: -100px;
            animation-delay: -4s;
        }

        .page {
            position: relative;
            z-index: 1;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .glass {
            width: min(460px, 100%);

            padding: 42px 30px 30px;

            text-align: center;

            border-radius: 38px;

            background: rgba(255, 255, 255, 0.075);

            border: 1px solid rgba(255, 255, 255, 0.16);

            box-shadow:
                0 35px 100px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);

            animation: appear 0.7s cubic-bezier(.2,.8,.2,1);
        }

        .moon {
            width: 145px;
            height: 145px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 68px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                0 0 70px rgba(150, 120, 255, 0.2),
                inset 0 1px 12px rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            transition:
                transform 0.5s ease,
                box-shadow 0.5s ease;
        }

        .glass.active .moon {
            transform: scale(1.06);

            box-shadow:
                0 0 90px rgba(150, 120, 255, 0.5),
                inset 0 1px 15px rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin: 0;

            font-size: 36px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .status {
            margin: 9px 0 0;

            font-size: 15px;

            color: rgba(255, 255, 255, 0.6);

            transition: opacity 0.25s ease;
        }

        .conversation {
            min-height: 85px;

            margin-top: 30px;

            padding: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.045);

            border: 1px solid rgba(255, 255, 255, 0.08);

            color: rgba(255, 255, 255, 0.82);

            line-height: 1.5;

            transition:
                background 0.3s ease,
                border 0.3s ease;
        }

        .conversation:empty::before {
            content: "Your conversation will appear here";
            color: rgba(255, 255, 255, 0.32);
        }

        .controls {
            display: flex;
            gap: 12px;

            margin-top: 22px;
        }

        button {
            flex: 1;

            min-height: 52px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 18px;

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.18s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.97);
        }

        .start {
            background: rgba(255, 255, 255, 0.12);

            box-shadow:
                inset 0 1px rgba(255, 255, 255, 0.18),
                0 10px 30px rgba(0, 0, 0, 0.2);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .start:hover {
            background: rgba(255, 255, 255, 0.17);
        }

        .end {
            background: rgba(255, 70, 90, 0.14);

            border-color: rgba(255, 100, 115, 0.22);
        }

        .end:hover {
            background: rgba(255, 70, 90, 0.22);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(25px, -20px);
            }
        }

        @media (max-width: 600px) {
            .page {
                padding: 14px;
            }

            .glass {
                padding: 35px 20px 22px;
                border-radius: 30px;
            }

            .moon {
                width: 120px;
                height: 120px;
                font-size: 58px;
            }

            h1 {
                font-size: 32px;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="orb one"></div>
        <div class="orb two"></div>
    </div>

    <main class="page">

        <section class="glass" id="callCard">

            <div class="moon" id="moon">
                🌙
            </div>

            <h1>Luna</h1>

            <p class="status" id="status">
                Ready to call
            </p>

            <div class="conversation" id="conversation"></div>

            <div class="controls">

                <button class="start" id="startCall">
                    Start Call
                </button>

                <button class="end" id="endCall">
                    End Call
                </button>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
